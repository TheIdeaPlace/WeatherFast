version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/windows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/CityData"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # tools/quickradar/requirements.txt, a developer tool rather than part of
  # an app. No UI toolkit in it (requests, ollama, Pillow), so one group
  # carries every package and a week's changes arrive as one PR.
  - package-ecosystem: pip
    directory: "/tools/quickradar"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      quickradar:
        patterns:
          - "*"
